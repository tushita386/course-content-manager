{% extends "base.html" %}
{% block title %}Login - Course Content Manager{% endblock %}
{% block content %}
<section class="auth-card card">
  <h1>Welcome back</h1>
  <p class="hint">Sign in to access your courses and learning materials.</p>
  {% if error %}<p class="error">{{ error }}</p>{% endif %}
  <form method="post" class="form">
    <input type="hidden" name="next" value="{{ request.args.get('next', '') }}">
    <label for="username">Username</label>
    <input id="username" name="username" required maxlength="80" autocomplete="username" autofocus>
    <label for="password">Password</label>
    <input id="password" type="password" name="password" required autocomplete="current-password">
    <button type="submit">Log in</button>
  </form>
</section>
{% endblock %}
