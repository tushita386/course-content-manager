{% extends "base.html" %}

{% block title %}{% if course %}Edit Course{% else %}New Course{% endif %}{% endblock %}

{% block content %}
<h1>{% if course %}Edit Course{% else %}Add New Course{% endif %}</h1>

<div class="form-card">
<form method="POST">
    <label>Title</label>
    <input type="text" name="title" value="{{ course.title if course else '' }}" required>

    <label>Subject</label>
    <input type="text" name="subject" value="{{ course.subject if course else '' }}">

    <label>Semester</label>
    <select name="semester">
        <option value="">-- Not specified --</option>
        {% for s in range(1, 9) %}
        <option value="{{ s }}" {% if course and course.semester == s %}selected{% endif %}>Semester {{ s }}</option>
        {% endfor %}
    </select>

    <label>Description</label>
    <textarea name="description">{{ course.description if course else '' }}</textarea>

    <button type="submit">Save</button>
</form>
</div>

<a href="{{ url_for('main.list_courses') }}">Back to My Courses</a>
{% endblock %}
