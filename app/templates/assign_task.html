{% extends "base.html" %}

{% block title %}Assign Task{% endblock %}

{% block content %}
<h1>Assign a Task — {{ course.title }}</h1>
<p>For {{ student.name }}</p>

<form method="POST">
    <label>Title</label>
    <input type="text" name="title" required>

    <label>Due Date</label>
    <input type="date" name="due_date">

    <label>Notes / Instructions</label>
    <textarea name="notes"></textarea>

    <button type="submit">Assign</button>
</form>

<a href="{{ url_for('main.instructor_student_courses', student_id=student.id) }}">Back to {{ student.name }}'s Courses</a>
{% endblock %}
